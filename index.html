<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur de Salaire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #1d1d1d;
            padding: 10px 0;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
            padding: 0 16px;
        }

        header {
            text-align: center;
            padding: 30px 0 20px;
            border-bottom: 1px solid #e5e5e5;
        }

        header h1 {
            font-size: 1.8em;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.9em;
            color: #666666;
        }

        .params-panel {
            background: #f5f5f7;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
        }

        .params-panel h2 {
            color: #1d1d1d;
            font-size: 1.4em;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .config-info {
            background: white;
            border: 1px solid #e5e5e5;
            padding: 16px;
            margin-bottom: 24px;
            border-radius: 8px;
            font-size: 0.95em;
            color: #666666;
        }

        .params-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .param-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .param-item label {
            font-size: 0.7em;
            color: #666666;
            font-weight: 500;
        }

        .param-item input,
        .param-item select {
            padding: 6px 8px;
            border: 1px solid #d5d5d7;
            border-radius: 4px;
            font-size: 0.85em;
            font-family: inherit;
            background: white;
        }

        .param-item input:focus,
        .param-item select:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        .display-box {
            padding: 8px 12px;
            background: white;
            border: 1px solid #d5d5d7;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9em;
            text-align: center;
        }

        .param-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .param-group .param-item {
            gap: 2px;
        }

        .param-group .param-item label {
            font-size: 0.65em;
        }

        .param-group .display-box {
            padding: 4px 8px;
            font-size: 0.85em;
        }

        .results-panel {
            background: white;
            margin: 20px 0 40px;
        }

        .results-panel h2 {
            color: #1d1d1d;
            font-size: 1.4em;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .result-box {
            background: #f5f5f7;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
        }

        .result-label {
            font-size: 0.7em;
            color: #666666;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .result-value {
            font-size: 1.4em;
            font-weight: 700;
            color: #1d1d1d;
        }

        .result-box.total {
            background: #0071e3;
            color: white;
            border: none;
        }

        .result-box.total .result-label {
            color: rgba(255,255,255,0.8);
        }

        .result-box.total .result-value {
            color: white;
            font-size: 1.8em;
        }

        .calculations {
            background: #f5f5f7;
            border-radius: 8px;
            padding: 12px;
            font-size: 1.05em;
            color: #666666;
            line-height: 1.5;
            margin-bottom: 16px;
            border: 1px solid #e5e5e5;
            text-align: center;
            font-weight: 500;
        }

        .calculations strong {
            color: #1d1d1d;
            font-weight: 600;
        }

        .export-btn {
            width: 100%;
            padding: 8px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            font-family: inherit;
        }

        .export-btn:hover {
            background: #0077ed;
            transform: scale(1.01);
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .params-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .results-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Simulateur de Salaire</h1>
            <p>Catherine ZACCARDI | Yerres (91330)</p>
        </header>

        <!-- PARAMÈTRES EN HAUT -->
        <div class="params-panel">
            <div class="config-info">
                <strong>Configuration :</strong> <span id="configDays">Lun, Mar, Jeu, Ven</span> | <span id="configHours">8h30 - 17h30</span>
            </div>

            <div class="params-grid">
                <div class="param-item">
                    <label>Jours/semaine</label>
                    <select id="daysPerWeek">
                        <option value="4">4 jours</option>
                        <option value="5">5 jours</option>
                    </select>
                </div>

                <div class="param-item">
                    <label>Début</label>
                    <input type="time" id="startTime" value="08:30">
                </div>

                <div class="param-item">
                    <label>Fin</label>
                    <input type="time" id="endTime" value="17:30">
                </div>

                <div class="param-group">
                    <div class="param-item">
                        <label>Heures/jour</label>
                        <div class="display-box">
                            <span id="calculatedHours">9.0</span>h
                        </div>
                    </div>

                    <div class="param-item">
                        <label>Heures/semaine</label>
                        <div class="display-box">
                            <span id="paramWeeklyHours">36.0</span>h
                        </div>
                    </div>
                </div>

                <div class="param-item">
                    <label>Taux horaire (€)</label>
                    <input type="number" id="hourlyRateNormal" value="3.75" step="0.01">
                </div>

                <div class="param-item">
                    <label>Indemnité entretien (€)</label>
                    <input type="number" id="dailyMaintenance" value="4.0" step="0.01">
                </div>

                <div class="param-item">
                    <label>Indemnité repas (€)</label>
                    <input type="number" id="dailyMeal" value="1.0" step="0.01">
                </div>
            </div>
        </div>

        <!-- RÉSULTATS EN BAS -->
        <div class="results-panel">
            <div class="calculations" id="monthlyExplanation" style="margin-bottom: 24px;"></div>

            <div class="results-grid">
                <div class="result-box">
                    <div class="result-label">Salaire horaire</div>
                    <div class="result-value" id="salary">0 €</div>
                </div>
                <div class="result-box">
                    <div class="result-label">Indemnité entretien</div>
                    <div class="result-value" id="maintenanceTotal">0 €</div>
                </div>
                <div class="result-box">
                    <div class="result-label">Indemnité repas</div>
                    <div class="result-value" id="mealTotal">0 €</div>
                </div>
                <div class="result-box total">
                    <div class="result-label" id="totalLabel">NET GLOBAL</div>
                    <div class="result-value" id="totalNet">0 €</div>
                </div>
            </div>

            <div class="calculations" id="detailedCalculation"></div>
            <button id="exportPdf" class="export-btn">📥 Exporter en PDF</button>
        </div>
    </div>

    <script>
        const inputs = {
            daysPerWeek: document.getElementById('daysPerWeek'),
            startTime: document.getElementById('startTime'),
            endTime: document.getElementById('endTime'),
            hourlyRateNormal: document.getElementById('hourlyRateNormal'),
            dailyMaintenance: document.getElementById('dailyMaintenance'),
            dailyMeal: document.getElementById('dailyMeal'),
        };

        const daysLabels = {
            4: 'Lun, Mar, Jeu, Ven',
            5: 'Lun - Ven'
        };

        function calculate() {
            const daysPerWeek = parseInt(inputs.daysPerWeek.value);

            const [startHour, startMin] = inputs.startTime.value.split(':').map(Number);
            const [endHour, endMin] = inputs.endTime.value.split(':').map(Number);

            const startTotalMin = startHour * 60 + startMin;
            const endTotalMin = endHour * 60 + endMin;
            const workMinutes = endTotalMin - startTotalMin;
            const hoursPerDay = workMinutes / 60;

            document.getElementById('calculatedHours').textContent = hoursPerDay.toFixed(1);

            const totalWeeklyHours = daysPerWeek * hoursPerDay;
            document.getElementById('paramWeeklyHours').textContent = totalWeeklyHours.toFixed(1);

            const daysLabel = daysLabels[daysPerWeek];
            const timeRange = `${inputs.startTime.value.slice(0,5)} - ${inputs.endTime.value.slice(0,5)}`;
            document.getElementById('configDays').textContent = daysLabel;
            document.getElementById('configHours').textContent = timeRange;

            const hourlyRateNormal = parseFloat(inputs.hourlyRateNormal.value);
            const dailyMaintenance = parseFloat(inputs.dailyMaintenance.value);
            const dailyMeal = parseFloat(inputs.dailyMeal.value);
            const period = 'monthly';

            const monthlyHours = (totalWeeklyHours * 52) / 12;
            const monthlyDays = daysPerWeek === 4 ? 18 : 22;

            const annualHours = totalWeeklyHours * 52;
            const annualDays = monthlyDays * 12;

            const monthlySalary = monthlyHours * hourlyRateNormal;
            const monthlyAllowances = (dailyMaintenance + dailyMeal) * monthlyDays;
            const monthlyTotal = monthlySalary + monthlyAllowances;

            const annualSalary = annualHours * hourlyRateNormal;
            const annualAllowances = (dailyMaintenance + dailyMeal) * annualDays;
            const annualTotal = annualSalary + annualAllowances;

            let displaySalary, displayAllowances, displayTotal, periodLabel;

            if (period === 'monthly') {
                displaySalary = monthlySalary;
                displayAllowances = monthlyAllowances;
                displayTotal = monthlyTotal;
                periodLabel = 'NET MENSUEL';
            } else {
                displaySalary = annualSalary;
                displayAllowances = annualAllowances;
                displayTotal = annualTotal;
                periodLabel = 'NET ANNUEL';
            }

            const totalMaintenance = dailyMaintenance * monthlyDays;
            const totalMeal = dailyMeal * monthlyDays;

            document.getElementById('salary').textContent = displaySalary.toFixed(2) + ' €';
            document.getElementById('maintenanceTotal').textContent = totalMaintenance.toFixed(2) + ' €';
            document.getElementById('mealTotal').textContent = totalMeal.toFixed(2) + ' €';
            document.getElementById('totalLabel').textContent = periodLabel;
            document.getElementById('totalNet').textContent = displayTotal.toFixed(2) + ' €';

            document.getElementById('monthlyExplanation').innerHTML = `
                <strong>Mensualisation :</strong> (${totalWeeklyHours.toFixed(1)}h/semaine × 52 semaines) ÷ 12 mois = ${monthlyHours.toFixed(1)}h/mois
            `;

            const dailyAllowance = dailyMaintenance + dailyMeal;

            if (period === 'monthly') {
                document.getElementById('detailedCalculation').innerHTML = `
                    <strong>Mensuel :</strong> ${monthlyHours.toFixed(1)}h × ${hourlyRateNormal}€ = ${monthlySalary.toFixed(2)}€ | Indemnités : ${monthlyDays} × ${dailyAllowance.toFixed(2)}€ = ${monthlyAllowances.toFixed(2)}€ | <strong>Total : ${monthlyTotal.toFixed(2)}€</strong>
                `;
            } else {
                document.getElementById('detailedCalculation').innerHTML = `
                    <strong>Annuel :</strong> ${annualHours.toFixed(1)}h × ${hourlyRateNormal}€ = ${annualSalary.toFixed(2)}€ | Indemnités : ${annualDays} × ${dailyAllowance.toFixed(2)}€ = ${annualAllowances.toFixed(2)}€ | <strong>Total : ${annualTotal.toFixed(2)}€</strong>
                `;
            }
        }

        Object.values(inputs).forEach(input => {
            input.addEventListener('change', calculate);
            input.addEventListener('input', calculate);
        });

        document.getElementById('exportPdf').addEventListener('click', function() {
            const daysPerWeek = parseInt(inputs.daysPerWeek.value);
            const startTime = inputs.startTime.value;
            const endTime = inputs.endTime.value;
            const hourlyRateNormal = parseFloat(inputs.hourlyRateNormal.value);
            const dailyMaintenance = parseFloat(inputs.dailyMaintenance.value);
            const dailyMeal = parseFloat(inputs.dailyMeal.value);

            const [startHour, startMin] = startTime.split(':').map(Number);
            const [endHour, endMin] = endTime.split(':').map(Number);
            const startTotalMin = startHour * 60 + startMin;
            const endTotalMin = endHour * 60 + endMin;
            const hoursPerDay = (endTotalMin - startTotalMin) / 60;

            const totalWeeklyHours = daysPerWeek * hoursPerDay;
            const monthlyHours = (totalWeeklyHours * 52) / 12;
            const monthlyDays = daysPerWeek === 4 ? 18 : 22;
            const monthlySalary = monthlyHours * hourlyRateNormal;
            const monthlyAllowances = (dailyMaintenance + dailyMeal) * monthlyDays;
            const monthlyTotal = monthlySalary + monthlyAllowances;

            const annualHours = totalWeeklyHours * 52;
            const annualDays = monthlyDays * 12;
            const annualSalary = annualHours * hourlyRateNormal;
            const annualAllowances = (dailyMaintenance + dailyMeal) * annualDays;
            const annualTotal = annualSalary + annualAllowances;

            const htmlContent = `
                <!DOCTYPE html>
                <html lang="fr">
                <head>
                    <meta charset="UTF-8">
                    <style>
                        body { font-family: Arial; padding: 20px; }
                        .header { text-align: center; border-bottom: 2px solid #667eea; padding-bottom: 10px; margin-bottom: 15px; }
                        .header h1 { color: #667eea; margin: 0; }
                        .section { margin-bottom: 15px; }
                        .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #ddd; }
                        .total { background: #667eea; color: white; font-weight: bold; padding: 8px; margin-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>Simulateur de Salaire</h1>
                        <p>Catherine ZACCARDI | ${new Date().toLocaleDateString('fr-FR')}</p>
                    </div>
                    <div class="section">
                        <h3>Paramètres</h3>
                        <div class="row"><span>${daysPerWeek} jours/semaine</span><span>${startTime} - ${endTime}</span></div>
                        <div class="row"><span>Taux horaire</span><span>${hourlyRateNormal}€/h</span></div>
                    </div>
                    <div class="section">
                        <h3>Résultats</h3>
                        <div class="row"><span>Salaire mensuel</span><span>${monthlyTotal.toFixed(2)}€</span></div>
                        <div class="row"><span>Salaire annuel</span><span>${annualTotal.toFixed(2)}€</span></div>
                    </div>
                </body>
                </html>
            `;

            const printWindow = window.open('', '', 'height=600,width=800');
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            setTimeout(() => printWindow.print(), 250);
        });

        calculate();
    </script>
</body>
</html>
